<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>자바주라 일정표</title>
<meta name="description" content="자바주라 야구팀 경기와 연습 일정">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚾</text></svg>">
<style>
  :root {
    --bg: #f6f5f1; --card: #ffffff; --ink: #1d1f23; --muted: #6b6f76; --line: #e3e1da;
    --game: #c8372d; --game-soft: #fbe9e7; --practice: #1f6f4a; --practice-soft: #e4f2ea;
    --accent: #1d3557; --today: #fff4cf; --sun: #c8372d; --sat: #2f5fb3;
    --win: #1d5fb3; --win-soft: #e3edfb; --lose: #8a8f96; --lose-soft: #eeeeec;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #15171a; --card: #1e2125; --ink: #ecebe7; --muted: #9a9ea5; --line: #2e3237;
      --game: #ff7b6e; --game-soft: #3a2220; --practice: #5fcf98; --practice-soft: #1b3226;
      --accent: #9cc3ff; --today: #3a3420; --sun: #ff7b6e; --sat: #8fb4ff;
      --win: #8fb4ff; --win-soft: #1e2a3d; --lose: #a3a7ad; --lose-soft: #2a2d31;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif;
  }
  main { max-width: 760px; margin: 0 auto; padding: 24px 16px 48px; }
  header h1 { margin: 0; font-size: 26px; letter-spacing: -0.02em; }
  header p { margin: 4px 0 0; color: var(--muted); font-size: 14px; }

  .next { margin: 20px 0; padding: 16px 18px; border-radius: 14px; background: var(--accent); color: #fff; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .next { color: #10151c; } }
  .next small { opacity: .8; font-size: 13px; }
  .next .what { font-size: 19px; font-weight: 700; margin-top: 2px; }
  .next .when { font-size: 14px; margin-top: 2px; }

  .bar { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 16px 0 10px; flex-wrap: wrap; }
  .monthnav { display: flex; align-items: center; gap: 6px; }
  .monthnav h2 { margin: 0 4px; font-size: 20px; min-width: 120px; text-align: center; }
  .btn {
    border: 1px solid var(--line); background: var(--card); color: var(--ink);
    border-radius: 999px; padding: 5px 12px; font: inherit; font-size: 14px; cursor: pointer;
  }
  .btn[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
  .filters { display: flex; gap: 6px; }

  .cal { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); border-top: 1px solid var(--line); border-left: 1px solid var(--line); background: var(--card); border-radius: 10px; overflow: hidden; }
  .cal .dow { text-align: center; font-size: 12px; font-weight: 700; padding: 6px 0; color: var(--muted); border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); background: var(--bg); }
  .cal .dow.sat { color: var(--sat); } .cal .dow.sun { color: var(--sun); }
  .cell {
    min-height: 84px; padding: 4px; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line);
    display: flex; flex-direction: column; gap: 3px; cursor: pointer; background: none; border-top: 0; border-left: 0;
    font: inherit; color: inherit; text-align: left; min-width: 0;
  }
  .cell.out { background: var(--bg); }
  .cell.out .num { opacity: .4; }
  .cell.today { background: var(--today); }
  .cell.sel { outline: 2px solid var(--accent); outline-offset: -2px; }
  .num { font-size: 13px; font-weight: 600; line-height: 1; }
  .cell.sat .num { color: var(--sat); } .cell.sun .num { color: var(--sun); }
  .ev {
    display: block; font-size: 11px; line-height: 1.25; padding: 2px 4px; border-radius: 4px;
    background: var(--soft); color: var(--c); font-weight: 700;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .game { --c: var(--game); --soft: var(--game-soft); }
  .practice { --c: var(--practice); --soft: var(--practice-soft); }
  .ev.done { opacity: .6; }
  .ev.win { --c: var(--win); --soft: var(--win-soft); }
  .ev.lose { --c: var(--lose); --soft: var(--lose-soft); }
  .ev.draw { --c: var(--muted); --soft: var(--bg); }

  .record { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap;
    background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 12px 16px; margin: -8px 0 16px; }
  .record small { display: block; font-size: 12px; color: var(--muted); }
  .rec-main b { font-size: 20px; margin-right: 8px; }
  .rec-main span { font-size: 13px; color: var(--muted); }
  .rec-recent div { display: flex; gap: 4px; margin-top: 2px; }
  .dot { width: 24px; height: 24px; border-radius: 50%; display: inline-grid; place-items: center; font-size: 12px; font-weight: 700; color: #fff; background: var(--muted); }
  .dot.win { background: var(--win); } .dot.lose { background: var(--lose); }

  .detail { margin-top: 16px; }
  .detail h3 { font-size: 15px; margin: 0 0 8px; color: var(--muted); font-weight: 600; }
  .item {
    display: block; background: var(--card); border: 1px solid var(--line); border-left: 4px solid var(--c);
    border-radius: 10px; padding: 10px 12px; margin-bottom: 8px; text-decoration: none; color: inherit;
  }
  .tag { display: inline-block; font-size: 12px; font-weight: 700; color: var(--c); background: var(--soft); border-radius: 4px; padding: 1px 6px; margin-right: 6px; }
  .title { font-weight: 600; }
  .meta { font-size: 14px; color: var(--muted); margin-top: 2px; overflow-wrap: anywhere; }
  .result { font-weight: 700; color: var(--ink); }
  .result.win { color: var(--win); }
  .result.lose { color: var(--lose); }
  .empty, .note { color: var(--muted); font-size: 14px; }
  footer { margin-top: 32px; font-size: 12px; color: var(--muted); }
  footer a { color: inherit; }

  @media (max-width: 480px) {
    main { padding: 20px 10px 40px; }
    .cell { min-height: 64px; padding: 3px 2px; }
    .ev { font-size: 10px; padding: 1px 2px; }
    .ev .long { display: none; }
    .monthnav h2 { font-size: 18px; min-width: 104px; }
  }
</style>
</head>
<body>
<main>
  <header>
    <h1>⚾ 자바주라 일정표</h1>
    <p>게임원 경기 일정과 팀 연습을 한곳에서 봅니다. 날짜를 누르면 자세히 나옵니다.</p>
  </header>

  <section class="next" id="next" hidden></section>
  <section class="record" id="record" hidden></section>

  <div class="bar">
    <div class="monthnav">
      <button class="btn" id="prev" aria-label="이전 달">◀</button>
      <h2 id="month-title"></h2>
      <button class="btn" id="next-month" aria-label="다음 달">▶</button>
      <button class="btn" id="this-month">오늘</button>
    </div>
    <div class="filters" role="group" aria-label="일정 종류">
      <button class="btn" data-f="all" aria-pressed="true">전체</button>
      <button class="btn" data-f="game" aria-pressed="false">경기</button>
      <button class="btn" data-f="practice" aria-pressed="false">연습</button>
    </div>
  </div>

  <div class="cal" id="cal"><p class="note" style="grid-column: 1 / -1; padding: 12px;">일정을 불러오는 중…</p></div>
  <section class="detail" id="detail"></section>

  <footer id="footer"></footer>
</main>
<script>
const DOW = ["일", "월", "화", "수", "목", "금", "토"];
const HEAD = ["월", "화", "수", "목", "금", "토", "일"];
const state = { filter: "all", items: [], year: 0, month: 0, selected: null };

const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const todayKST = () => new Date(Date.now() + 9 * 3600e3).toISOString().slice(0, 10);
const iso = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;

async function load(path) {
  try {
    const r = await fetch(path + "?t=" + Date.now(), { cache: "no-store" });
    return r.ok ? await r.json() : null;
  } catch { return null; }
}

function describe(it) {
  if (it.type === "game") {
    return {
      tag: "경기",
      title: it.opponent ? `vs ${it.opponent}` : (it.league || "경기"),
      meta: [it.time, it.place, it.league].filter(Boolean).join(" · "),
      result: [it.score, it.outcome, it.status].filter(Boolean).join(" "),
      win: (it.outcome || "").startsWith("승") ? "win" : (it.outcome || "").startsWith("패") ? "lose" : "",
    };
  }
  return {
    tag: "연습",
    title: "팀 연습" + (it.headcount ? ` (${it.headcount}명)` : ""),
    meta: [it.time, it.place, it.memo].filter(Boolean).join(" · "),
    result: "",
  };
}

// 칸 안에 들어갈 짧은 글: 경기는 '시간 상대'(끝난 경기는 '승/패 점수'), 연습은 '시간 연습'
function chip(it) {
  const time = (it.time || "").slice(0, 5);
  if (it.type === "game") {
    if (it.score) return `${esc(it.outcome.slice(0, 1))} ${esc(it.score)} <span class="long">${esc(it.opponent || "")}</span>`;
    if (it.status) return `${esc(it.status)}`;
    return `${esc(time)} <span class="long">${esc(it.opponent || "경기")}</span>`;
  }
  return `${esc(time)} <span class="long">연습</span>`;
}

function resultClass(it) {
  const o = (it.outcome || "").slice(0, 1);
  return o === "승" ? "win" : o === "패" ? "lose" : o === "무" ? "draw" : "";
}

function renderRecord() {
  const el = document.getElementById("record");
  const year = String(state.year);
  const played = state.items.filter(it => it.type === "game" && it.score && it.date.startsWith(year));
  if (!played.length) { el.hidden = true; return; }
  const n = k => played.filter(it => resultClass(it) === k).length;
  const w = n("win"), l = n("lose"), d = n("draw");
  const [rf, ra] = played.reduce(([f, a], it) => { const [x, y] = it.score.split(":").map(Number); return [f + x, a + y]; }, [0, 0]);
  const pct = w + l ? (w / (w + l)).toFixed(3).replace(/^0/, "") : "-";
  const recent = played.slice(-5).map(it =>
    `<span class="dot ${resultClass(it)}" title="${esc(it.date)} vs ${esc(it.opponent)} ${esc(it.score)}">${esc(it.outcome.slice(0, 1))}</span>`).join("");
  el.innerHTML = `<div class="rec-main"><small>${year} 시즌 전적</small>
      <b>${w}승 ${l}패${d ? ` ${d}무` : ""}</b><span>승률 ${pct} · 득점 ${rf} · 실점 ${ra}</span></div>
    <div class="rec-recent"><small>최근 ${Math.min(5, played.length)}경기</small><div>${recent}</div></div>`;
  el.hidden = false;
}

function visible() {
  return state.items.filter(it => state.filter === "all" || it.type === state.filter);
}

function renderCalendar() {
  const today = todayKST();
  const { year, month } = state;
  document.getElementById("month-title").textContent = `${year}년 ${month + 1}월`;

  const byDate = {};
  for (const it of visible()) (byDate[it.date] ||= []).push(it);

  // 월요일 시작: 1일이 속한 주의 월요일부터 채운다. 5주로 다 안 들어가는 달만 6주.
  const first = new Date(year, month, 1);
  const lead = (first.getDay() + 6) % 7;
  const days = new Date(year, month + 1, 0).getDate();
  const weeks = Math.ceil((lead + days) / 7) > 5 ? 6 : 5;
  const start = new Date(year, month, 1 - lead);

  let html = HEAD.map((h, i) => `<div class="dow${i === 5 ? " sat" : i === 6 ? " sun" : ""}">${h}</div>`).join("");
  for (let i = 0; i < weeks * 7; i++) {
    const d = new Date(start.getFullYear(), start.getMonth(), start.getDate() + i);
    const key = iso(d);
    const evs = byDate[key] || [];
    const cls = ["cell",
      d.getMonth() !== month ? "out" : "",
      key === today ? "today" : "",
      key === state.selected ? "sel" : "",
      i % 7 === 5 ? "sat" : i % 7 === 6 ? "sun" : ""].filter(Boolean).join(" ");
    html += `<button class="${cls}" data-date="${key}" aria-label="${d.getMonth() + 1}월 ${d.getDate()}일 일정 ${evs.length}개">
      <span class="num">${d.getDate()}</span>
      ${evs.map(it => `<span class="ev ${it.type}${it.score ? " " + resultClass(it) : key < today ? " done" : ""}">${chip(it)}</span>`).join("")}
    </button>`;
  }
  const cal = document.getElementById("cal");
  cal.innerHTML = html;
  cal.querySelectorAll(".cell").forEach(c => c.addEventListener("click", () => {
    state.selected = c.dataset.date;
    const d = new Date(c.dataset.date + "T00:00:00");
    if (d.getMonth() !== state.month) { state.year = d.getFullYear(); state.month = d.getMonth(); }
    render();
  }));
}

function renderDetail() {
  const el = document.getElementById("detail");
  const today = todayKST();
  let items, heading;
  if (state.selected) {
    const d = new Date(state.selected + "T00:00:00");
    items = visible().filter(it => it.date === state.selected);
    heading = `${d.getMonth() + 1}월 ${d.getDate()}일 (${DOW[d.getDay()]})`;
  } else {
    const prefix = `${state.year}-${String(state.month + 1).padStart(2, "0")}`;
    items = visible().filter(it => it.date.startsWith(prefix));
    heading = `${state.month + 1}월 일정`;
  }
  if (!items.length) { el.innerHTML = `<h3>${heading}</h3><p class="empty">일정이 없습니다.</p>`; return; }
  el.innerHTML = `<h3>${heading}</h3>` + items.map(it => {
    const d = describe(it), dt = new Date(it.date + "T00:00:00");
    const tagName = it.url ? "a" : "div";
    const href = it.url ? ` href="${esc(it.url)}" target="_blank" rel="noopener"` : "";
    const day = state.selected ? "" : `${dt.getDate()}일(${DOW[dt.getDay()]}) `;
    return `<${tagName} class="item ${it.type}"${href}>
      <div><span class="tag">${d.tag}</span><span class="title">${day}${esc(d.title)}</span></div>
      ${d.meta || d.result ? `<div class="meta">${d.result ? `<span class="result ${d.win || ""}">${esc(d.result)}</span> · ` : ""}${esc(d.meta)}</div>` : ""}
    </${tagName}>`;
  }).join("");
}

function renderNext() {
  const today = todayKST();
  const next = state.items.find(it => it.date >= today);
  const el = document.getElementById("next");
  if (!next) { el.hidden = true; return; }
  const d = describe(next), dt = new Date(next.date + "T00:00:00");
  const days = Math.round((dt - new Date(today + "T00:00:00")) / 864e5);
  el.innerHTML = `<small>다음 일정 · ${days === 0 ? "오늘" : days === 1 ? "내일" : days + "일 뒤"}</small>
    <div class="what">${next.type === "game" ? "경기 " : ""}${esc(d.title)}</div>
    <div class="when">${dt.getMonth() + 1}월 ${dt.getDate()}일 (${DOW[dt.getDay()]}) ${esc(d.meta)}</div>`;
  el.hidden = false;
}

function render() { renderNext(); renderRecord(); renderCalendar(); renderDetail(); }

function shiftMonth(n) {
  const d = new Date(state.year, state.month + n, 1);
  state.year = d.getFullYear(); state.month = d.getMonth(); state.selected = null;
  render();
}
document.getElementById("prev").addEventListener("click", () => shiftMonth(-1));
document.getElementById("next-month").addEventListener("click", () => shiftMonth(1));
document.getElementById("this-month").addEventListener("click", () => {
  const t = new Date(todayKST() + "T00:00:00");
  state.year = t.getFullYear(); state.month = t.getMonth(); state.selected = null;
  render();
});
document.querySelectorAll(".filters .btn").forEach(b => b.addEventListener("click", () => {
  state.filter = b.dataset.f;
  document.querySelectorAll(".filters .btn").forEach(x => x.setAttribute("aria-pressed", x === b));
  render();
}));

(async () => {
  const t = new Date(todayKST() + "T00:00:00");
  state.year = t.getFullYear(); state.month = t.getMonth();
  const [games, practices] = await Promise.all([load("data/games.json"), load("data/practices.json")]);
  state.items = [...(games?.games || []), ...(practices?.practices || [])]
    .filter(it => it.date)
    .sort((a, b) => (a.date + (a.time || "")).localeCompare(b.date + (b.time || "")));
  const foot = [];
  if (games?.updated) {
    const club = games.club_idx ? ` · <a href="https://www.gameone.kr/club/?club_idx=${games.club_idx}" target="_blank" rel="noopener">게임원 팀 페이지</a>` : "";
    foot.push(`게임원 일정 갱신: ${esc(games.updated.replace("T", " ").slice(0, 16))}${club}`);
  }
  foot.push("연습 일정은 단톡방 투표 확정 후 등록됩니다.");
  document.getElementById("footer").innerHTML = foot.join("<br>");
  render();
})();
</script>
</body>
</html>
